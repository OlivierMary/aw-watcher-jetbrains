import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.20.1'
    id 'org.openapi.generator' version '7.27.0'
}

group = 'fr.mary.olivier'
version = '2.1.1'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def generatedDir = layout.buildDirectory.dir('generated')

// Version.java, read by InfoAction
def generateVersion = tasks.register('generateVersion') {
    def outputDir = generatedDir.map { it.dir('version') }
    def pluginVersion = project.version.toString()
    inputs.property('version', pluginVersion)
    outputs.dir(outputDir)
    doLast {
        def versionFile = outputDir.get().file('fr/mary/olivier/aw/watcher/Version.java').asFile
        versionFile.parentFile.mkdirs()
        versionFile.text = """package fr.mary.olivier.aw.watcher;

public class Version {
    public static String getVersion() {
        return "${pluginVersion}";
    }
}
"""
    }
}

// ActivityWatch REST client
openApiGenerate {
    generatorName = 'java'
    library = 'okhttp-gson'
    inputSpec = layout.projectDirectory.file('src/main/resources/swagger.yaml').asFile.path
    outputDir = generatedDir.get().dir('openapi').asFile.path
    apiPackage = 'org.openapitools.client.api'
    modelPackage = 'org.openapitools.client.model'
    invokerPackage = 'org.openapitools.client'
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions = [
            hideGenerationTimestamp: 'true',
            openApiNullable        : 'false',
    ]
}

// The generated client still calls JsonReader.setLenient(true), deprecated since Gson 2.11:
// switch it to the equivalent setStrictness(LENIENT) (reported by the Plugin Verifier)
tasks.named('openApiGenerate') {
    doLast {
        def json = generatedDir.get().file('openapi/src/main/java/org/openapitools/client/JSON.java').asFile
        def source = json.text
        def fixed = source.replace('jsonReader.setLenient(true);', 'jsonReader.setStrictness(com.google.gson.Strictness.LENIENT);')
        if (fixed == source) {
            throw new GradleException("JsonReader.setLenient(true) not found in ${json}: check the generated client")
        }
        json.text = fixed
    }
}

sourceSets {
    main {
        java.srcDir(generateVersion)
        java.srcDir(tasks.named('openApiGenerate').map { generatedDir.get().dir('openapi/src/main/java') })
    }
}

dependencies {
    intellijPlatform {
        create(IntelliJPlatformType.IntellijIdeaCommunity, '2022.3.3')
        bundledPlugin 'Git4Idea'
    }

    // runtime dependencies of the generated REST client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'io.gsonfire:gson-fire:1.9.0'

    // compile time only
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}

// runIde cannot start an IDE older than 2023.3: manual tests run on a recent IDE
intellijPlatformTesting {
    runIde {
        register('runIdeLatest') {
            type = IntelliJPlatformType.IntellijIdea
            version = '2026.3'
        }
    }
}

